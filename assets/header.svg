<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Willian Silva — Desenvolvedor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040a"/>
      <stop offset="1" stop-color="#0d0a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="600" cy="150" rx="520" ry="170" fill="url(#glow)"/>

  <g fill="#a78bfa">
    <circle cx="90" cy="250" r="2" opacity="0.5"/><circle cx="170" cy="200" r="1.5" opacity="0.4"/>
    <circle cx="250" cy="260" r="2.5" opacity="0.35"/><circle cx="130" cy="120" r="1.5" opacity="0.3"/>
    <circle cx="1010" cy="240" r="2" opacity="0.5"/><circle cx="1090" cy="180" r="1.5" opacity="0.4"/>
    <circle cx="1130" cy="260" r="2.5" opacity="0.35"/><circle cx="1050" cy="90" r="1.5" opacity="0.3"/>
    <circle cx="330" cy="40" r="1.5" opacity="0.3"/><circle cx="880" cy="270" r="2" opacity="0.35"/>
  </g>

  <rect x="250" y="55" width="700" height="190" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.5" filter="url(#blur)"/>
  <rect x="250" y="55" width="700" height="190" fill="#0e0c1a" fill-opacity="0.78" stroke="#6d3df5" stroke-width="1.2"/>

  <g fill="none" stroke="#c4b5fd" stroke-width="2.5">
    <path d="M250 80V55H275"/><path d="M925 55H950V80"/>
    <path d="M250 220V245H275"/><path d="M925 245H950V220"/>
  </g>

  <text x="276" y="84" font-family="'Courier New', monospace" font-size="13" letter-spacing="4" fill="#8b5cf6">[ PERFIL ]</text>
  <text x="600" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="50" font-weight="bold" letter-spacing="9" fill="#a78bfa" opacity="0.55" filter="url(#blur)">WILLIAN SILVA</text>
  <text x="600" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="50" font-weight="bold" letter-spacing="9" fill="#efeaff">WILLIAN SILVA</text>
  <rect x="330" y="170" width="540" height="1.5" fill="url(#line)"/>
  <text x="600" y="204" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" letter-spacing="6" fill="#a78bfa">DESENVOLVEDOR · WEB · PYTHON</text>

  <rect x="0" y="297" width="1200" height="3" fill="url(#line)"/>
</svg>
