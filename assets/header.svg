<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Willian Silva — Desenvolvedor. Painel de status: função desenvolvedor, foco web e Git, stack JavaScript, HTML, CSS e Python, local Setúbal.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03030a"/>
      <stop offset="1" stop-color="#0b0722"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f4a" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#080f2a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="wisp" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g filter="url(#smoke)">
